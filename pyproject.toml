[project]
name = "munr"
version = "0.5.0"
description = "Persistent fact store that stops the model from confabulating stable user facts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary]>=3.2",
]

[project.scripts]
munr = "munr.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munr"]

[tool.pytest.ini_options]
# `munr` is importable via the editable install (uv sync). importlib mode avoids sys.path
# manipulation, so the test dir never shadows the real `munr` package. Keep munr's suite
# isolated from the donor tests under tests/ (whose conftest mocks psycopg2, unused here).
addopts = "--import-mode=importlib"
testpaths = ["tests/munr"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/munr"]
